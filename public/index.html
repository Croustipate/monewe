<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONEYWEB — Tickets cantine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Tickets cantine</h1>
    <div id="sync-banner">
      <span id="sync-status">Chargement...</span>
      <button id="btn-sync">Synchroniser</button>
    </div>
  </header>

  <main>
    <section class="filters">
      <div class="date-range">
        <label>Du <input type="date" id="date-from"></label>
        <label>Au <input type="date" id="date-to"></label>
      </div>
      <div class="shortcuts">
        <button data-shortcut="month">Ce mois-ci</button>
        <button data-shortcut="last-month">Mois précédent</button>
        <button data-shortcut="3months">3 derniers mois</button>
        <button data-shortcut="year">Cette année</button>
      </div>
    </section>

    <section class="summary">
      <div class="stat">
        <span class="stat-label">Passages</span>
        <span class="stat-value" id="stat-count">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Total dépensé</span>
        <span class="stat-value" id="stat-total">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Moyenne / repas</span>
        <span class="stat-value" id="stat-avg">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Rechargements</span>
        <span class="stat-value amount-positive" id="stat-credited">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Solde actuel</span>
        <span class="stat-value" id="stat-balance">—</span>
      </div>
    </section>

    <section class="actions">
      <button id="btn-export">Exporter CSV</button>
      <button id="btn-pdf-year">PDF année <span id="pdf-year-label"></span></button>
    </section>

    <section class="tickets">
      <table>
        <thead>
          <tr><th>Date</th><th>Libellé</th><th>Montant</th><th>Solde</th><th></th></tr>
        </thead>
        <tbody id="tickets-body">
          <tr><td colspan="5" class="empty">Aucun ticket</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <dialog id="ticket-dialog">
    <div class="dialog-inner">
      <div class="ticket-receipt" id="ticket-receipt-content"></div>
      <div class="dialog-actions">
        <button class="btn-secondary" id="dialog-close">Fermer</button>
        <button id="dialog-print">Imprimer / PDF</button>
      </div>
    </div>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
